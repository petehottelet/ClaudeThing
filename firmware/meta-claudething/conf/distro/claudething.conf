require conf/distro/superbird.conf

DISTRO = "claudething"
DISTRO_NAME = "ClaudeThing"
DISTRO_VERSION = "1.0.0"
MAINTAINER = "ClaudeThing contributors"

SUPERBIRD_HOSTNAME = "claudething"
SUPERBIRD_MDNS_SERVICE_NAME = "ClaudeThing"
SUPERBIRD_USB_GADGET_NAME = "claudething"
SUPERBIRD_USB_GADGET_MANUFACTURER = "ClaudeThing"
SUPERBIRD_USB_GADGET_PRODUCT = "ClaudeThing Dashboard"
SUPERBIRD_BOOT_LOGO_NAME = "claudething-bootup.bmp"
SUPERBIRD_WESTON_SPLASH_IMAGE = "claudething-splash.png"

CHROMIUM_KIOSK_URL = "http://127.0.0.1:8080/"

# Keep the package manifest on-device. Full per-package license texts remain
# in Yocto's deploy output so releases can ship them without duplicating them
# in the space-constrained root filesystem.
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "0"
